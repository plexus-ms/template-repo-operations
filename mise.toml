[tools]
hk = "latest" # Git hooks
uv = "latest" # required for copier
copier = { version = "latest", uvx = true } # renders the template for the newborn test
node = "24" # the runtime of plx below and nothing else
# plx: the requirements check (§ 1.8 PLX), here only in the commit-msg hook,
# which refuses a message naming an issue identifier; the initiative's own
# package from plexus-ms/tooling, pinned at the Plexus version by `plx-dev
# ship` (§ 1.5 PLX); the trust-policy approval only waives npm's young-package
# heuristics.
"npm:@plexus-ms/cli" = { version = "0.123.0", allow_low_downloads = true }

[hooks]
postinstall = "if command -v hk >/dev/null; then hk install --mise; fi"

# Contract verbs (§ 3 PLX-Repo). The repo is a copier template: check renders
# it into a new operations repo, in each shape, and runs that repo's own
# check, and the verbs it has no use for exist and pass.

[tasks.dev]
description = "No-op: the repo is a template; edit the files under template/"
run = 'echo "dev: nothing to start in a template"'

[tasks.build]
description = "No-op: the template produces no artifact; copier renders it"
run = 'echo "build: nothing to build in a template"'

[tasks.lint]
description = "Formatting of the template's own text files: no trailing whitespace, one final newline, one kind of line ending"
usage = '''
flag "--write" help="Fix the files in place"
arg "<paths>" var=#true default="." help="Files or directories to lint (defaults to the whole repo)"
'''
# hk's own fixers, the same the newborn's lint runs. A .jinja file is linted
# as it renders, in the newborn, which check runs: its source may end in a
# tag where the rendered file ends in one newline.
run = '''
eval "set -- $usage_paths"
files=$(git ls-files --cached --others --exclude-standard -- "$@" | grep -v -e '^LICENSE$' -e '\.jinja$' || true)
[ -n "$files" ] || exit 0
status=0
for fixer in trailing-whitespace end-of-file-fixer mixed-line-ending; do
  printf '%s\n' "$files" | tr '\n' '\0' | xargs -0 hk util "$fixer" ${usage_write:+--fix} || status=1
done
[ "$status" = 0 ] || echo "lint: \`mise :lint --write\` fixes these in place" >&2
exit "$status"
'''

[tasks.check]
description = "Lint, then render the template into a new operations repo, in each shape, under git's hook environment, and run that repo's own check"
run = ['mise run lint', 'tests/hook-env.sh']

[tasks.test]
description = "No-op: the template holds no code to execute; what it renders is checked, not tested, by check"
run = 'echo "test: nothing to test in a template"'

[tasks.verify]
description = "Perform all steps that verify code quality"
run = ['mise run check', 'mise run test']
