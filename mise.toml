# The verbs are asked as `mise :verb` (the hooks in hk.pkl, § 2 PLX-Repo); that
# form needs the root marker even without sub-projects.
monorepo_root = true
# The root is the only config: template/ holds the newborn's, as a template.
[monorepo]
config_roots = ["."]

[tools]
hk = "latest"
# mise's Python keeps the uv tools' environments inside the cached data directory; it must satisfy
# every uv tool's Python requirement, and after changing it reinstall them (`mise install -f <tool>`).
python = "3.14"
uv = "latest"
copier = { version = "latest", uvx = true }
node = "24" # the runtime of plx below and nothing else
# plx lints the template's own files in `check` (§ 1.8 PLX), pinned by `plx-dev ship` (§ 1.5 PLX);
# allow_low_downloads only waives npm's young-package heuristics.
"npm:@plexus-ms/cli" = { version = "0.129.0", allow_low_downloads = true }

[hooks]
postinstall = "if command -v hk >/dev/null; then hk install --mise; fi"

[tasks.dev]
description = "No-op: the repo is a template; edit the files under template/"
run = 'echo "dev: nothing to start in a template"'

[tasks.build]
description = "No-op: the template produces no artifact; copier renders it"
run = 'echo "build: nothing to build in a template"'

[tasks.lint]
description = "Formatting of the template's own text files: no trailing whitespace, one final newline, one kind of line ending"
usage = '''
flag "--write" help="Fix the files in place"
arg "<paths>" var=#true default="." help="Files or directories to lint (defaults to the whole repo)"
'''
# A .jinja file is linted as it renders, in the newborn: its source may end in a tag, not a newline.
run = '''
eval "set -- $usage_paths"
files=$(git ls-files --cached --others --exclude-standard -- "$@" | grep -v -e '^LICENSE$' -e '\.jinja$' || true)
[ -n "$files" ] || exit 0
status=0
for fixer in trailing-whitespace end-of-file-fixer mixed-line-ending; do
  printf '%s\n' "$files" | tr '\n' '\0' | xargs -0 hk util "$fixer" ${usage_write:+--fix} || status=1
done
[ "$status" = 0 ] || echo "lint: \`mise :lint --write\` fixes these in place" >&2
exit "$status"
'''

[tasks.check]
description = "Lint, run plx requirements over the template, then render the template into a new operations repo, in each shape, under git's hook environment, and run that repo's own check"
run = ['mise run lint', 'plx requirements .', 'tests/hook-env.sh']

[tasks.test]
description = "No-op: the template holds no code to execute; what it renders is checked, not tested, by check"
run = 'echo "test: nothing to test in a template"'

[tasks.verify]
description = "Perform all steps that verify code quality"
run = ['mise run check', 'mise run test']
