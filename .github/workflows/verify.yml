name: verify

# Mounts the verify verb on every push (§ 2 PLX-Delivery): the template is
# rendered into a new operations repo, in each shape, and that repo's own
# check is run in it, the same `mise :check` the pre-push hook runs, through
# the shared `check` mount with the whole verb as its task.

on:
  push:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: plexus-ms/tooling/.github/workflows/_check.yml@0.123.0
    with:
      tasks: verify
