name: verify

# Mounts the verify verb on every push (§ 2 PLX-Delivery).

on:
  push:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: plexus-ms/tooling/.github/workflows/_check.yml@0.124.0
    with:
      tasks: verify
